<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业知识库问答助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f4f6f9; color: #1f2937; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: #fff; border-bottom: 1px solid #e5e7eb;
    padding: 14px 20px; display: flex; align-items: center; gap: 10px;
  }
  header .dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; color: #6b7280; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { display: flex; margin-bottom: 16px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14.5px; word-wrap: break-word; }
  .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .traj { font-size: 11.5px; color: #9ca3af; margin-top: 6px; }
  .msg.user .traj { text-align: right; }
  /* markdown 渲染样式 */
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; }
  .bubble table th, .bubble table td { border: 1px solid #d1d5db; padding: 6px 10px; text-align: left; }
  .bubble table th { background: #f3f4f6; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 8px 0 4px; font-size: 15px; }
  .bubble p { margin: 4px 0; }
  .bubble ul, .bubble ol { margin: 4px 0 4px 20px; }
  .bubble code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble strong { font-weight: 600; }
  /* 参考来源面板 */
  .src-wrap { margin-top: 8px; }
  .src-toggle { font-size: 12px; color: #2563eb; cursor: pointer; background: none; border: none; padding: 0; }
  .src-list { margin-top: 6px; display: none; }
  .src-list.open { display: block; }
  .src-item { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; font-size: 12px; }
  .src-name { color: #2563eb; font-weight: 600; }
  .src-sim { color: #9ca3af; float: right; }
  .src-text { color: #4b5563; margin-top: 3px; line-height: 1.5; max-height: 90px; overflow-y: auto; }
  footer {
    background: #fff; border-top: 1px solid #e5e7eb; padding: 14px 20px;
  }
  #inputbar { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  #q {
    flex: 1; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px;
    font-size: 14.5px; outline: none;
  }
  #q:focus { border-color: #2563eb; }
  #send {
    padding: 0 22px; background: #2563eb; color: #fff; border: none; border-radius: 10px;
    font-size: 14.5px; cursor: pointer;
  }
  #send:hover { background: #1d4ed8; }
  #send:disabled { background: #9ca3af; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>企业知识库问答助手</h1>
    <span class="sub">制度 / 考勤 / 通讯录，一问便知</span>
    <button id="clear" onclick="clearChat()" style="margin-left:auto;background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;font-size:13px;color:#4b5563;cursor:pointer;">新对话</button>
  </header>

  <div id="chat">
    <div class="msg bot">
      <div class="bubble">你好，我是企业知识库问答助手。可以问我公司制度、考勤休假、员工通讯录等问题。</div>
    </div>
  </div>

  <footer>
    <div id="inputbar">
      <input id="q" type="text" placeholder="输入你的问题，如：公司有双休吗？" autocomplete="off">
      <button id="send" onclick="ask()">发送</button>
    </div>
  </footer>

<script>
  let history = [];   // 记住这次对话说过的每一句，每次提问一起发给后端
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s){
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }
  function renderMarkdown(md){
    const lines = md.split('\n'); let html = ''; let i = 0;
    let inList = false, listType = null;
    const closeList = () => { if(inList){ html += (listType==='ul'?'</ul>':'</ol>'); inList=false; listType=null; } };
    const parseRow = r => r.split('|').map(c=>c.trim()).filter((c,idx,arr)=> !((idx===0||idx===arr.length-1) && c===''));
    while(i < lines.length){
      const line = lines[i].trimEnd();
      // 表格
      if(line.includes('|') && i+1 < lines.length && lines[i+1].includes('-') && /^[\s|:-]+$/.test(lines[i+1].trim())){
        closeList();
        const head = parseRow(line); i += 2; const rows = [];
        while(i < lines.length && lines[i].includes('|')){ rows.push(parseRow(lines[i])); i++; }
        html += '<table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'
             + rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
        continue;
      }
      const h = line.match(/^(#{1,4})\s+(.*)$/);
      if(h){ closeList(); const n=h[1].length; html += '<h'+n+'>'+inline(h[2])+'</h'+n+'>'; i++; continue; }
      const ul = line.match(/^\s*[-*]\s+(.*)$/);
      if(ul){ if(!inList||listType!=='ul'){ closeList(); html+='<ul>'; inList=true; listType='ul'; } html+='<li>'+inline(ul[1])+'</li>'; i++; continue; }
      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if(ol){ if(!inList||listType!=='ol'){ closeList(); html+='<ol>'; inList=true; listType='ol'; } html+='<li>'+inline(ol[1])+'</li>'; i++; continue; }
      if(!line.trim()){ closeList(); i++; continue; }
      closeList(); html += '<p>'+inline(line)+'</p>'; i++;
    }
    closeList(); return html;
  }

  function renderSources(sources){
    if(!sources || !sources.length) return '';
    let html = '<div class="src-wrap">';
    html += '<button class="src-toggle" onclick="this.nextElementSibling.classList.toggle(\'open\')">📎 展开参考来源 (' + sources.length + ')</button>';
    html += '<div class="src-list">';
    sources.forEach(s => {
      const name = s.source || '未知来源';
      const sim = (s.similarity !== null && s.similarity !== undefined) ? ('相似度 ' + s.similarity) : '';
      html += '<div class="src-item"><span class="src-name">📄 ' + esc(name) + '</span>' +
        '<span class="src-sim">' + esc(sim) + '</span>' +
        '<div class="src-text">' + esc(s.text || '') + '</div></div>';
    });
    html += '</div></div>';
    return html;
  }

  function addMsg(role, text, traj, sources){
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<div class="bubble">' + renderMarkdown(text) + '</div>' +
      renderSources(sources) +
      (traj ? '<div class="traj">🔧 ' + esc(traj) + '</div>' : '');
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function ask(){
    const input = document.getElementById('q');
    const btn = document.getElementById('send');
    const q = input.value.trim();
    if(!q) return;
    input.value = '';
    btn.disabled = true;
    addMsg('user', q, '');
    const loading = addMsg('bot', '正在思考…', '');
    try{
      const resp = await fetch('/query', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: q, history: history})
      });
      const data = await resp.json();
      loading.remove();
      addMsg('bot', data.answer || '（无回答）', data.trajectory && data.trajectory.length ? '调用了 ' + data.trajectory.join('；') : '', data.sources);
      // 成功后把这一问一答记进历史，下一条提问就会带上
      history.push({role: 'user', content: q});
      history.push({role: 'assistant', content: data.answer || ''});
    }catch(e){
      loading.remove();
      addMsg('bot', '请求失败：' + e.message, '');
    }
    btn.disabled = false;
    input.focus();
  }

  function clearChat(){
    history = [];
    const chat = document.getElementById('chat');
    chat.innerHTML = '';
    addMsg('bot', '你好，我是企业知识库问答助手。可以问我公司制度、考勤休假、员工通讯录等问题。');
  }

  document.getElementById('q').addEventListener('keydown', e => { if(e.key === 'Enter') ask(); });
</script>
</body>
</html>
